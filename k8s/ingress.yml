apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: newsera-unified-ingress
  namespace: newsera
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    
    nginx.ingress.kubernetes.io/use-regex: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
 
          
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
